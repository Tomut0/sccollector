name: SCCollector
version: '${version}'
main: scstats.collector.CollectorPlugin
depend: [SimpleClans]
commands:
  scstats:
    description: Manage the SimpleClansStats collector
    permission: sccollector.configure
    usage: /scstats ingest | /scstats config apply --endpoint <url> --api-key <key>
permissions:
  sccollector.configure:
    default: op
